<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sign In — Tools for the Tough Days</title>
  <link rel="icon" type="image/png" href="/data/TOUGH%20DAYS_LOGO.png" />
  <link rel="stylesheet" href="/assets/theme-unified.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ui-cream);
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid var(--ui-border);
      border-radius: 12px;
      box-shadow: var(--ui-shadow);
      padding: 36px 32px;
    }

    .card h1 {
      font-size: 1.4rem;
      color: var(--ui-teal-dark);
      margin-bottom: 4px;
    }

    .card p.subtitle {
      font-size: 0.85rem;
      color: var(--ui-muted);
      margin-bottom: 28px;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ui-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.95rem;
      border: 1.5px solid var(--ui-border);
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: var(--ui-teal);
      box-shadow: 0 0 0 3px rgba(38,119,123,0.1);
    }

    .error-msg {
      display: none;
      font-size: 0.82rem;
      color: #c0392b;
      margin-bottom: 16px;
    }

    .error-msg.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: var(--ui-teal);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button[type="submit"]:hover { background: var(--ui-teal-dark); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body data-auth="guest">
  <div class="card">
    <h1>Admin sign in</h1>
    <p class="subtitle">Staff access only — Tools for the Tough Days member management.</p>

    <p class="error-msg" id="errorMsg"></p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
  </div>

  <script src="/admin/admin-guard.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      var errorMsg = document.getElementById('errorMsg');
      var submitBtn = document.getElementById('submitBtn');
      errorMsg.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      fetch('/api/admin/auth.php?action=login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      })
        .then(async function (res) {
          var data = await res.json();
          if (!res.ok) {
            errorMsg.textContent = data.message || 'Sign in failed.';
            errorMsg.classList.add('visible');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign in';
            return;
          }
          window.location.href = '/admin/index.html';
        })
        .catch(function () {
          errorMsg.textContent = 'Network error, please try again.';
          errorMsg.classList.add('visible');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
        });
    });
  </script>
</body>
</html>
